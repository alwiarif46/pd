name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual runs: image push (push-images) and the production deploy (deploy). Both are inert without the repository
  # variable / secrets described in infra/README.md.
  workflow_dispatch:
    inputs:
      ref:
        description: 'git ref the server deploys'
        default: master
        type: string
      image_tag:
        description: 'pre-built image tag (a commit sha) to pull instead of building on the server; empty = build'
        default: ''
        type: string

# Least privilege: every job reads the repository and nothing else. push-images adds packages: write for itself.
permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. Runs on master and manual dispatches are never cancelled:
# their group is the unique run id.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm typecheck

  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm --filter @pd/web v0:check
      - name: Secret scan (the same scanner as the pre-commit hook; test-infra runs it too)
        run: python3 .githooks/secret_scan.py --all
      - name: Skills stay out of git (only the two PD skills are tracked)
        run: |
          extra="$(git ls-files skills | grep -v -e '^skills/bid-summary/' -e '^skills/compliance-matrix/' || true)"
          if [ -n "$extra" ]; then
            echo "::error::tracked files under skills/ other than skills/bid-summary and skills/compliance-matrix:"
            echo "$extra"
            exit 1
          fi

  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm build

  test-web:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm --filter @pd/web test

  test-api:
    # Tenant-isolation tests against a real Postgres. With the superuser below, the tests
    # create a non-superuser owner role, migrate a fresh database as that owner, then connect
    # as pd_app so row-level security is exercised.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres  # secret-scan: allow (throwaway CI database)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm --filter @pd/api test

  test-infra:
    # Offline tests of the infrastructure scripts (fakes only: no provider, Cloudflare, Backblaze or GHCR call).
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nftables python3-yaml
      - run: bash ops/ci/set-exec-bits.sh --check
      - run: python3 .githooks/secret_scan.py --all
      - run: bash infra/tests/run-tests.sh
      - run: bash ops/tests/run-tests.sh
      # needs root: real container files, loop devices (never a format or mount), nft in a network namespace
      - run: sudo bash infra/tests/test-root-container.sh

  restore-drill:
    # The restore drill against REAL Postgres (ops/ci/restore-drill-ci.sh): migrate a source database with the repo's
    # migrations, take a real pg_dump -Fc, check restore.sh's validation (a truncated dump must be refused), then run
    # restore.sh's SQL path from ops/lib/backup-common.sh into a second, fresh Postgres twice and compare. No network
    # beyond these two service containers (no Borg, no B2: the archive layer is covered by ops/tests with fakes).
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      pgsrc:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pd_owner
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: pd
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pd_owner -d pd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      pgdst:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pd_owner
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: pd
        options: >-
          --health-cmd "pg_isready -U pd_owner -d pd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: migrate the source database (as pd_owner, like the compose migrate service)
        env:
          DATABASE_URL: postgres://pd_owner:drill@localhost:5433/pd  # secret-scan: allow (throwaway CI database)
        run: pnpm db:migrate
      - name: restore drill
        run: bash ops/ci/restore-drill-ci.sh --src "${{ job.services.pgsrc.id }}" --dst "${{ job.services.pgdst.id }}" --workdir "$RUNNER_TEMP" --seed

  contracts:
    # Contract drift (pnpm contracts:check), the contract and stage-interface tests, and the version-bump check against the
    # base branch (packages/contracts/scripts/bump.ts). The contracts tests take about 3 minutes. Full history, so the merge base exists.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Contract drift (OpenAPI, event schemas, generated types, skeleton routes)
        run: pnpm contracts:check
      - name: Version bump against the base branch (pull requests only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm contracts:check:bump -- --base "origin/$BASE_REF"
      - name: Contracts and stage-interface tests
        timeout-minutes: 15
        run: pnpm --filter @pd/contracts --filter @pd/stage-interface test

  test-services:
    # Everything that needs a real Postgres and is not the gateway: @pd/service-kit, @pd/testing and the twelve TypeScript
    # service skeletons. A FRESH cluster: the service-kit tests reset the passwords of the cluster-wide <schema>_svc roles,
    # so they refuse a cluster where those roles already have a login password (packages/service-kit/test/guard.ts), and
    # under CI=true that refusal is a failure. This job does not set SERVICE_KIT_TEST_RESETS_ROLES for the job. The gateway
    # (@pd/api) and its tests stay in test-api: both create the cluster-wide pd_app and pd_system roles, so they must not share a cluster.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres  # secret-scan: allow (throwaway CI database)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      # First, on the untouched cluster, so the guard sees no service role with a password.
      - name: 'Schema isolation: a service role cannot read another service schema'
        run: pnpm --filter @pd/service-kit exec vitest run test/isolation.test.ts test/owner-rls.test.ts
      - name: '@pd/service-kit tests (all of them, the isolation tests again)'
        # The step above left passwords on the roles, so the guard would now refuse. This step, and only this step, says
        # resetting them is fine: the cluster is a throwaway service container of this job.
        env:
          SERVICE_KIT_TEST_RESETS_ROLES: '1'
        run: pnpm --filter @pd/service-kit test
      - name: '@pd/testing tests (tenant fixtures, seed, doubles, pnpm migrate end to end)'
        run: pnpm --filter @pd/testing test
      - name: The twelve TypeScript service skeletons
        # One package at a time: they share the cluster.
        run: >-
          pnpm --workspace-concurrency=1
          --filter @pd/identity --filter @pd/billing --filter @pd/ingest --filter @pd/intel
          --filter @pd/orchestrator --filter @pd/modelgw --filter @pd/drafting --filter @pd/review
          --filter @pd/evidence --filter @pd/comms --filter @pd/drive --filter @pd/notify
          test

  test-python:
    # The two Python services (render, portal-agent): uv workspace at the repo root, pytest against a fresh Postgres, mypy on both src folders.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres  # secret-scan: allow (throwaway CI database)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5.4.2
        with:
          version: '0.11.32'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --frozen
      - name: pytest (render and portal-agent)
        run: uv run --frozen pytest
      - name: mypy
        # mypy is not a dependency of the workspace; --with adds it for this command only.
        run: uv run --frozen --with mypy mypy python/render/src python/portal-agent/src

  e2e-web:
    # Playwright smoke test of the built web app (services/gateway/web/e2e), served by vite preview.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @pd/web build
      - run: pnpm --filter @pd/web exec playwright test
      - name: Upload the Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            services/gateway/web/playwright-report
            services/gateway/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  build-docker:
    # Build only, no push (pull requests, every push). The matrix has the five deployed images plus the 12 TypeScript and 2 Python service skeletons. The build context is the repo root; each Dockerfile installs the
    # workspace with the frozen lockfile, builds its app, and ships production deps only.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    needs: [typecheck, lint, build, test-web, test-api, test-infra, restore-drill, contracts, test-services, test-python]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: web, file: services/gateway/web/Dockerfile, target: '' }
          - { app: api, file: services/gateway/Dockerfile, target: runtime }
          - { app: migrate, file: services/gateway/Dockerfile, target: migrate }
          - { app: worker, file: services/worker/Dockerfile, target: '' }
          - { app: sandbox, file: services/ingest/sandbox/Dockerfile, target: '' }
          # Skeleton services (built to prove the Dockerfiles work; push-images below does not push them).
          - { app: svc-identity, file: services/identity/Dockerfile, target: '' }
          - { app: svc-billing, file: services/billing/Dockerfile, target: '' }
          - { app: svc-ingest, file: services/ingest/Dockerfile, target: '' }
          - { app: svc-intel, file: services/intel/Dockerfile, target: '' }
          - { app: svc-orchestrator, file: services/orchestrator/Dockerfile, target: '' }
          - { app: svc-modelgw, file: services/modelgw/Dockerfile, target: '' }
          - { app: svc-drafting, file: services/drafting/Dockerfile, target: '' }
          - { app: svc-review, file: services/review/Dockerfile, target: '' }
          - { app: svc-evidence, file: services/evidence/Dockerfile, target: '' }
          - { app: svc-comms, file: services/comms/Dockerfile, target: '' }
          - { app: svc-drive, file: services/drive/Dockerfile, target: '' }
          - { app: svc-notify, file: services/notify/Dockerfile, target: '' }
          - { app: py-render, file: python/render/Dockerfile, target: '' }
          - { app: py-portal-agent, file: python/portal-agent/Dockerfile, target: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  push-images:
    # OFF by default. Runs only on a manual dispatch, or on a push to master when the repository variable
    # PD_PUSH_IMAGES is 'true' (Settings > Secrets and variables > Actions > Variables). Pull requests never push.
    # Images: ghcr.io/<owner>/pd-<app>:<commit sha> (infra/scripts/deploy.sh --pull-tag <sha>), plus :master only when the
    # run is on refs/heads/master (a manual run on another branch must not move :master).
    # *verify* the owner is lowercase in GHCR and check the package visibility (HUMAN-TODO H-07).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.PD_PUSH_IMAGES == 'true')
    timeout-minutes: 45
    runs-on: ubuntu-latest
    needs: [build-docker]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: web, file: services/gateway/web/Dockerfile, target: '' }
          - { app: api, file: services/gateway/Dockerfile, target: runtime }
          - { app: migrate, file: services/gateway/Dockerfile, target: migrate }
          - { app: worker, file: services/worker/Dockerfile, target: '' }
          - { app: sandbox, file: services/ingest/sandbox/Dockerfile, target: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pd-${{ matrix.app }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/master' && format('ghcr.io/{0}/pd-{1}:master', github.repository_owner, matrix.app) || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}

  deploy:
    # Manual only (workflow_dispatch) and only from master, behind the 'production' environment (a required reviewer and
    # a deployment branch policy of master only: HUMAN-TODO H-07). Inert without its secrets: the gate step skips
    # everything and the job ends green with a notice. Never runs on push.
    # It waits for push-images (a dispatch always pushes this commit's images), so an image_tag of this commit exists
    # before the server pulls it. push-images must have SUCCEEDED (a dispatch always runs it): a skipped or failed push
    # means the image tag may not exist. always() plus the explicit result checks keep the job from running after any
    # failure.
    if: >-
      always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
      && needs.typecheck.result == 'success' && needs.lint.result == 'success' && needs.build.result == 'success'
      && needs.test-web.result == 'success' && needs.test-api.result == 'success' && needs.test-infra.result == 'success'
      && needs.restore-drill.result == 'success' && needs.contracts.result == 'success' && needs.test-services.result == 'success'
      && needs.test-python.result == 'success' && needs.e2e-web.result == 'success'
      && needs.push-images.result == 'success'
    needs: [typecheck, lint, build, test-web, test-api, test-infra, restore-drill, contracts, test-services, test-python, e2e-web, push-images]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    steps:
      - name: gate
        id: gate
        env:
          PD_DEPLOY_HOST: ${{ secrets.PD_DEPLOY_HOST }}
          PD_DEPLOY_SSH_KEY: ${{ secrets.PD_DEPLOY_SSH_KEY }}
          PD_DEPLOY_KNOWN_HOSTS: ${{ secrets.PD_DEPLOY_KNOWN_HOSTS }}
          PD_TS_AUTHKEY: ${{ secrets.PD_TS_AUTHKEY }}
          PD_TS_LOGIN_SERVER: ${{ secrets.PD_TS_LOGIN_SERVER }}
        run: |
          if [ -n "$PD_DEPLOY_HOST" ] && [ -n "$PD_DEPLOY_SSH_KEY" ] && [ -n "$PD_DEPLOY_KNOWN_HOSTS" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::deploy skipped: secrets not set"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$PD_TS_AUTHKEY" ] && [ -n "$PD_TS_LOGIN_SERVER" ]; then
            echo "ts=true" >> "$GITHUB_OUTPUT"
          else
            echo "ts=false" >> "$GITHUB_OUTPUT"
          fi
      # *verify* tailscale/github-action@v3 with a Headscale control server (--login-server in args)
      - if: steps.gate.outputs.enabled == 'true' && steps.gate.outputs.ts == 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.PD_TS_AUTHKEY }}
          args: --login-server=${{ secrets.PD_TS_LOGIN_SERVER }}
      - if: steps.gate.outputs.enabled == 'true'
        name: deploy over the admin network (forced command deploy.sh --ci)
        env:
          PD_DEPLOY_HOST: ${{ secrets.PD_DEPLOY_HOST }}
          PD_DEPLOY_SSH_KEY: ${{ secrets.PD_DEPLOY_SSH_KEY }}
          PD_DEPLOY_KNOWN_HOSTS: ${{ secrets.PD_DEPLOY_KNOWN_HOSTS }}
          REF: ${{ inputs.ref }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          # the inputs are data: check their shape before they go into the request
          printf '%s' "$REF" | grep -Eq '^[A-Za-z0-9._/-]{1,100}$' || { echo "bad ref input"; exit 1; }
          # the server accepts only master or a release tag (deploy.sh --ci); refuse anything else here already
          printf '%s' "$REF" | grep -Eq '^(master|v[0-9]+(\.[0-9]+){0,2}(-[A-Za-z0-9.]+)?)$' || { echo "ref must be master or a release tag v<N>[.<N>[.<N>]]"; exit 1; }
          if [ -n "$IMAGE_TAG" ]; then printf '%s' "$IMAGE_TAG" | grep -Eq '^[0-9a-f]{7,40}$' || { echo "bad image_tag input"; exit 1; }; fi
          umask 077
          printf '%s\n' "$PD_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$PD_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          REQUEST="ref=$REF"
          if [ -n "$IMAGE_TAG" ]; then REQUEST="$REQUEST tag=$IMAGE_TAG"; fi
          ssh -i "$RUNNER_TEMP/deploy_key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o StrictHostKeyChecking=yes "pddeploy@$PD_DEPLOY_HOST" "$REQUEST"
      - if: always()
        name: delete the key
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"
