# ClamAV daemon configuration for Proposal Development Tool
# Settings from the archived PD plan (docs/plans/archive-pd/)

# Log to the image's own file. /dev/stdout does not work: the image's init starts clamd with its output redirected, and
# clamd fails with "Failed to open log file /dev/stdout: Symbolic link loop" (CI, PR 64).
LogFile /var/log/clamav/clamd.log
LogTime yes

# Socket settings. The image's startup waits for the unix socket, so it must be set. Its healthcheck (clamdcheck.sh)
# pings TCP 3310 on localhost, which may resolve to ::1. TCPAddr is unset so clamd binds IPv4 and IPv6, as in the image.
LocalSocket /tmp/clamd.sock
TCPSocket 3310

# Max file size limits (300 MB to support largest uploads)
MaxFileSize 300M
MaxScanSize 300M
StreamMaxLength 300M

# Prevent concurrent database reload (scans pause briefly instead)
ConcurrentDatabaseReload no

# Performance
MaxThreads 4
MaxDirectoryRecursion 15

# Follow directory symlinks
FollowDirectorySymlinks yes
FollowFileSymlinks yes

# Scan settings
ScanPDF yes
ScanOLE2 yes
ScanHTML yes
ScanArchive yes
ScanMail yes
ScanPE yes

# Temporary directory
TemporaryDirectory /tmp

# Database directory
DatabaseDirectory /var/lib/clamav
