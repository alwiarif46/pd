# ClamAV daemon configuration for Proposal Development Tool
# Settings from 01-infrastructure.md section 2.2

# Log to stdout so the container runtime collects the log. No rotation: a size limit cannot rotate /dev/stdout.
LogFile /dev/stdout
LogFileMaxSize 0
LogTime yes

# Socket settings. The image's startup and its clamdcheck.sh healthcheck talk to clamd through the unix socket, so it
# must be set. TCP stays for the services.
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0

# Max file size limits (300 MB to support largest uploads)
MaxFileSize 300M
MaxScanSize 300M
StreamMaxLength 300M

# Prevent concurrent database reload (scans pause briefly instead)
ConcurrentDatabaseReload no

# Performance
MaxThreads 4
MaxDirectoryRecursion 15

# Follow directory symlinks
FollowDirectorySymlinks yes
FollowFileSymlinks yes

# Scan settings
ScanPDF yes
ScanOLE2 yes
ScanHTML yes
ScanArchive yes
ScanMail yes
ScanPE yes

# Temporary directory
TemporaryDirectory /tmp

# Database directory
DatabaseDirectory /var/lib/clamav
