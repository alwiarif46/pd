# ClamAV daemon configuration for Proposal Development Tool
# Settings from 01-infrastructure.md section 2.2

# Log settings
LogFile /var/log/clamav/clamd.log
LogTime yes
LogSyslog yes

# Socket settings
TCPSocket 3310
TCPAddr 0.0.0.0

# Max file size limits (300 MB to support largest uploads)
MaxFileSize 300M
MaxScanSize 300M
StreamMaxLength 300M

# Prevent concurrent database reload (scans pause briefly instead)
ConcurrentDatabaseReload no

# Performance
MaxThreads 4
MaxDirectoryRecursion 15

# Follow directory symlinks
FollowDirectorySymlinks yes
FollowFileSymlinks yes

# Scan settings
ScanPDF yes
ScanOLE2 yes
ScanHTML yes
ScanArchive yes
ScanMail yes
ScanPE yes

# Temporary directory
TemporaryDirectory /tmp

# Database directory
DatabaseDirectory /var/lib/clamav
