version: '3.9'

# Build contexts are the repo root (the Dockerfiles need the workspace lockfile and packages).
# Run from the repo root with the env file, e.g.:
#   docker compose --env-file .env -f infra/docker-compose.yml build

services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: pd-web:latest
    restart: unless-stopped
    # Static build served by nginx, not a running container

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: pd-api:latest
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql://pd_app:${PD_APP_PASSWORD}@postgres:5432/pd
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ORIGIN=https://pd.shaavir.com
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # One-off: applies database migrations as the owner role pd_owner. Not started by `up`;
  # infra/scripts/deploy.sh runs it before the api and worker restart.
  migrate:
    profiles: ['tools']
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: pd-migrate:latest
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://pd_owner:${POSTGRES_PASSWORD}@postgres:5432/pd

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    image: pd-worker:latest
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - clamav
    environment:
      - DATABASE_URL=postgresql://pd_app:${PD_APP_PASSWORD}@postgres:5432/pd
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M

  sandbox:
    build:
      context: ..
      dockerfile: apps/sandbox/Dockerfile
    image: pd-sandbox:latest
    profiles: ['tools'] # started on demand by the sandbox runner (docker compose run), not by up
    network_mode: none
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.5G

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=pd
      - POSTGRES_USER=pd_owner
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pd_owner -d pd']
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 256M

  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 1.5G

volumes:
  postgres_data:
  redis_data:
  clamav_data:
