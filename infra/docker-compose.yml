# Build contexts are the repo root (the Dockerfiles need the workspace lockfile and packages).
# Run from the repo root with the env file, e.g.:
#   docker compose --env-file .env -f infra/docker-compose.yml build
#
# Data placement (Drive D-147 layout): Postgres, Redis and the uploaded files live on the LUKS volume mounted at
# /mnt/pddata (infra/luks/README.md), NOT in Docker named volumes on the unencrypted root disk. PD_DATA_ROOT
# overrides the mount point for tests only. deploy.sh refuses to start unless /mnt/pddata is mounted from the mapper.
# Images: PD_IMAGE_PREFIX / PD_IMAGE_TAG select pre-built registry images (deploy.sh --pull-tag); the defaults
# (pd-<app>:latest) are the locally built ones, as before.
# The host sandbox runner needs DATA_DIR=/mnt/pddata/files (the same files, seen from the host).

services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: ${PD_IMAGE_PREFIX:-pd-}web:${PD_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Static build served by nginx, not a running container

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: ${PD_IMAGE_PREFIX:-pd-}api:${PD_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql://pd_app:${PD_APP_PASSWORD}@postgres:5432/pd
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ORIGIN=https://pd.shaavir.com
      - DATA_DIR=/data/files
      # Named in the privacy statement (GET /api/about/processing). deploy.sh sets both from the tenant file.
      - PD_HOSTING_SUBPROCESSOR=${PD_HOSTING_SUBPROCESSOR:-}
      - PD_BACKUP_SUBPROCESSOR=${PD_BACKUP_SUBPROCESSOR:-}
      # Email (Resend) and SMS (Telnyx) for sign-up, reset and invite messages, from /opt/pd/.env.
      # With NODE_ENV=production (the image default) the api refuses to start unless both are set.
      - APP_URL=${APP_URL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - PD_EMAIL_FROM=${PD_EMAIL_FROM:-}
      - TELNYX_API_KEY=${TELNYX_API_KEY:-}
      - TELNYX_FROM=${TELNYX_FROM:-}
      - TELNYX_MESSAGING_PROFILE_ID=${TELNYX_MESSAGING_PROFILE_ID:-}
      # Testers whose phone step is skipped (exact emails, comma-separated). Empty: off.
      - PD_SKIP_PHONE_VERIFY_EMAILS=${PD_SKIP_PHONE_VERIFY_EMAILS:-}
      # The proxy whose X-Forwarded-For the api believes, so the per-IP send caps count visitors, not nginx.
      # Set it to the network gateway pinned below (172.31.250.1): the host's nginx reaches the api through the
      # loopback port, which arrives from that gateway. Empty: no proxy trusted, every visitor counts as one IP.
      - PD_TRUST_PROXY=${PD_TRUST_PROXY:-}
    # Loopback only: the host's nginx (infra/nginx.conf) proxies /api here. Not reachable from outside the host.
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ${PD_DATA_ROOT:-/mnt/pddata}/files:/data/files
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # One-off: applies database migrations as the owner role pd_owner. Not started by `up`;
  # infra/scripts/deploy.sh runs it before the api and worker restart.
  migrate:
    profiles: ['tools']
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: ${PD_IMAGE_PREFIX:-pd-}migrate:${PD_IMAGE_TAG:-latest}
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://pd_owner:${POSTGRES_PASSWORD}@postgres:5432/pd

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    image: ${PD_IMAGE_PREFIX:-pd-}worker:${PD_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - clamav
    environment:
      - DATABASE_URL=postgresql://pd_app:${PD_APP_PASSWORD}@postgres:5432/pd
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATA_DIR=/data/files
    volumes:
      - ${PD_DATA_ROOT:-/mnt/pddata}/files:/data/files
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M

  sandbox:
    build:
      context: ..
      dockerfile: apps/sandbox/Dockerfile
    image: ${PD_IMAGE_PREFIX:-pd-}sandbox:${PD_IMAGE_TAG:-latest}
    profiles: ['tools'] # started on demand by the sandbox runner (docker compose run), not by up
    network_mode: none
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.5G

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - ${PD_DATA_ROOT:-/mnt/pddata}/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=pd
      - POSTGRES_USER=pd_owner
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pd_owner -d pd']
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ${PD_DATA_ROOT:-/mnt/pddata}/redis:/data
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 256M

  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 1.5G

# The default network's subnet and gateway are pinned so PD_TRUST_PROXY can name the gateway, the address the
# api sees for requests from the host's nginx through the loopback port.
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.250.0/24
          gateway: 172.31.250.1

# Only the ClamAV signatures stay in a named volume: they are downloaded, not customer data.
volumes:
  clamav_data:
