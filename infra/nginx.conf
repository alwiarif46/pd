server {
    listen 443 ssl http2;
    server_name pd.shaavir.com;

    # Cloudflare Origin certificate
    ssl_certificate /etc/nginx/ssl/pd.shaavir.com.pem;
    ssl_certificate_key /etc/nginx/ssl/pd.shaavir.com.key;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # The visitor's address, for the api's per-IP send caps. Only Cloudflare reaches 443 (host firewall), and
    # nginx believes CF-Connecting-IP only from Cloudflare's ranges. Keep this list equal to
    # infra/server/cloudflare-ips.txt (infra/tests/run-tests.sh checks it; refresh both together).
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Request size limit (for 20 MB chunks, with margin)
    client_max_body_size 300M;

    # Static files (web build)
    location / {
        root /var/www/pd;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    # API proxy
    # The api is published on the host's loopback only (infra/docker-compose.yml); `api` resolves only
    # inside the compose network, not from this host nginx.
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # $remote_addr is the visitor (real_ip above). X-Forwarded-For is overwritten, never appended, so a
        # header the visitor sent cannot choose the address the api counts.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:3001/health;
        access_log off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
