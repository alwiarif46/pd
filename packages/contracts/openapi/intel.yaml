          format: date-time
        dueDate:
          type:
            - string
            - "null"
          format: date-time
        dueTime:
          type:
            - string
            - "null"
        timeZone:
          type:
            - string
            - "null"
        oralsEnabled:
          type: boolean
        retentionExtendedUntil:
