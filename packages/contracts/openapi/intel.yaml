openapi: 3.1.0
info:
  title: Solicitation intel service
  version: 0.2.0
x-service: intel
security:
  - bearerAuth: []
tags:
  - name: bids
    description: Bids and the bid/no-bid score.
  - name: rows
    description: Tabs and their rows.
  - name: amendments
    description: Amendments and their row changes.
  - name: schedule
    description: Dates and the schedule.
  - name: check-these
    description: Sentences the matrix may have missed.
  - name: jobs
    description: Intel jobs.
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness and schema migration level
      security: []
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /bids:
    get:
      operationId: listBids
      summary: List the tenant's bids
      tags:
        - bids
      security:
        - bearerAuth: []
      description: The tenant comes from the verified token. No tenant id is sent.
      responses:
        "200":
          description: The bids.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bid"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createBid
      summary: Create a bid
      tags:
        - bids
      security:
        - bearerAuth: []
      description: The tenant comes from the verified token. No tenant id is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBidRequest"
      responses:
        "201":
          description: The bid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bid"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bids/{id}:
    get:
      operationId: getBid
      summary: Get a bid
      tags:
        - bids
      security:
        - bearerAuth: []
      description: The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
      responses:
        "200":
          description: The bid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateBid
      summary: Change a bid
      tags:
        - bids
      security:
        - bearerAuth: []
      description: A new solicitation number rechecks held amendments. 409 key_locked once the bid holds a credit for its number. Extending file retention is owner only (403 owner_only) and needs a paid plan (402 plan_required). The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBidRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteBid
      summary: Delete a bid
      tags:
        - bids
      security:
        - bearerAuth: []
      description: Removes the bid and its rows, then emits intel.bid.deleted. Ingest deletes the bid's documents when it gets the event. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /bids/{id}/tabs/{tab}:
    get:
      operationId: getBidTab
      summary: Read a tab
      tags:
        - rows
      security:
        - bearerAuth: []
      description: The rows of one tab. Every AI-extracted row carries sourcePage and sourceQuote. An unknown tab is 404. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - name: tab
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TabName"
      responses:
        "200":
          description: The tab's rows. The shape depends on the tab.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TabPayload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /bids/{id}/tabs/{tab}/rows:
    post:
      operationId: createTabRow
      summary: Add a row to a tab
      tags:
        - rows
      security:
        - bearerAuth: []
      description: The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - name: tab
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TabName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RowFields"
      responses:
        "201":
          description: The new row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Row"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /bids/{id}/tabs/{tab}/seed:
    post:
      operationId: seedTab
      summary: Seed a tab with its standard rows
      tags:
        - rows
      security:
        - bearerAuth: []
      description: Overview, production, orals and lessons get their standard rows once. Schedule applies a template counted back from the due date (400 due_date_required, 409 schedule_template_exists). Seeding twice adds nothing. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - name: tab
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TabName"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RowFields"
      responses:
        "200":
          description: Seeded.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Ok"
                  - $ref: "#/components/schemas/AdjustResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /bids/{id}/rows/{table}/{rowId}:
    get:
      operationId: getRow
      summary: Read a row and its history
      tags:
        - rows
      security:
        - bearerAuth: []
      description: The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - name: table
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RowTable"
        - name: rowId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RowDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateRow
      summary: Change fields of a row
      tags:
        - rows
      security:
        - bearerAuth: []
      description: Typed fields reject values outside their lists with 400. Every change writes row history. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - name: table
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RowTable"
        - name: rowId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchRowRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteRow
      summary: Delete a row
      tags:
        - rows
      security:
        - bearerAuth: []
      description: The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - name: table
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RowTable"
        - name: rowId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /bids/{id}/outline/move:
    post:
      operationId: moveOutlineItem
      summary: Move an outline item
      tags:
        - rows
      security:
        - bearerAuth: []
      description: The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutlineMoveRequest"
      responses:
        "200":
          description: The new order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /bids/{id}/matrix:
    get:
      operationId: getComplianceMatrix
      summary: Read the compliance matrix
      tags:
        - rows
      security:
        - bearerAuth: []
      description: The compliance rows of the bid, the same rows as the compliance tab. Each row has sourcePage and sourceQuote. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
      responses:
        "200":
          description: The matrix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceMatrix"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /bids/{id}/compliance/merge:
    post:
      operationId: mergeComplianceRows
      summary: Merge compliance rows
      tags:
        - rows
      security:
        - bearerAuth: []
      description: Keeps the first row and joins the text of the others. Open amendment proposals that name a merged row are rejected. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeRowsRequest"
      responses:
        "200":
          description: The kept row.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /bids/{id}/compliance/split:
    post:
      operationId: splitComplianceRow
      summary: Split a compliance row
      tags:
        - rows
      security:
        - bearerAuth: []
      description: The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitRowRequest"
      responses:
        "201":
          description: The new second row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Row"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /bids/{id}/amendments:
    get:
      operationId: listAmendments
      summary: List a bid's amendments
      tags:
        - amendments
      security:
        - bearerAuth: []
      description: Each amendment with its number, status, key check and date change. The web joins these with ingest documents for the Documents tab. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
      responses:
        "200":
          description: The amendments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Amendment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /bids/{id}/amendments/{documentId}/key-override:
    post:
      operationId: overrideAmendmentKey
      summary: Accept an amendment despite its solicitation number
      tags:
        - amendments
      security:
        - bearerAuth: []
      description: "A reason is required (400). Each bid has a fixed number of overrides, never refunded. 409 codes: override_not_needed, override_limit, set_bid_number_first, solicitation_first, document_deleted, not_an_amendment. Owner only. The tenant comes from the verified token. No tenant id is sent."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The amendment's document id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyOverrideRequest"
      responses:
        "200":
          description: The override is recorded and processing resumes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyOverrideResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-roles:
        - owner
  /bids/{id}/amendments/{documentId}/amendment-no:
    patch:
      operationId: setAmendmentNo
      summary: Set an amendment's number
      tags:
        - amendments
      security:
        - bearerAuth: []
      description: 400 invalid_amendment_no outside 1 to 999. 409 amendment_no_taken, document_deleted or not_an_amendment. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The amendment's document id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmendmentNoRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmendmentNoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /bids/{id}/amendment-links:
    get:
      operationId: listAmendmentLinks
      summary: List an amendment's proposed row changes
      tags:
        - amendments
      security:
        - bearerAuth: []
      description: Each link names the old and new row and carries sourcePage and sourceQuote from the amendment text. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
      responses:
        "200":
          description: The links.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AmendmentLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /amendment-links/{id}/confirm:
    post:
      operationId: confirmAmendmentLink
      summary: Confirm a proposed change
      tags:
        - amendments
      security:
        - bearerAuth: []
      description: Decisions are final. 409 link_already_decided, row_already_closed or new_row_missing. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /amendment-links/{id}/reject:
    post:
      operationId: rejectAmendmentLink
      summary: Reject a proposed change
      tags:
        - amendments
      security:
        - bearerAuth: []
      description: Decisions are final. 409 link_already_decided. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /bids/{id}/schedule:
    get:
      operationId: getSchedule
      summary: Read the schedule
      tags:
        - schedule
      security:
        - bearerAuth: []
      description: "The same payload as the schedule tab: activities by start date, the workdays setting, amendment proposals and the pending date change. The tenant comes from the verified token. No tenant id is sent."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleTab"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /bids/{id}/schedule/adjust:
    post:
      operationId: adjustSchedule
      summary: Shift, scale or keep the schedule dates
      tags:
        - schedule
      security:
        - bearerAuth: []
      description: With amendmentId it answers that amendment's date change and sets the bid's due date. 400 invalid_date. 409 date_change_resolved or activity_locked. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustRequest"
      responses:
        "200":
          description: What moved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /bids/{id}/check-these:
    get:
      operationId: listCheckThese
      summary: List sentences to check
      tags:
        - check-these
      security:
        - bearerAuth: []
      description: Open "check these" hits from documents the user has not deleted. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
      responses:
        "200":
          description: The hits.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CheckThese"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /check-these/{id}/promote:
    post:
      operationId: promoteCheckThese
      summary: Turn a hit into a compliance row
      tags:
        - check-these
      security:
        - bearerAuth: []
      description: 409 when the sentence is no longer on its page or was already decided. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: The new compliance row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Row"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /check-these/{id}/dismiss:
    post:
      operationId: dismissCheckThese
      summary: Dismiss a hit
      tags:
        - check-these
      security:
        - bearerAuth: []
      description: The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dismissed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /bids/{id}/fit:
    get:
      operationId: getBidFit
      summary: Read the bid/no-bid score
      tags:
        - bids
      security:
        - bearerAuth: []
      description: The score and its factors. Every factor has a source. Before scoring, score is null. The decision itself (POST /bids/{id}/fit/decision) belongs to the orchestrator. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
      responses:
        "200":
          description: The score.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidFit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /bids/{id}/jobs:
    get:
      operationId: listIntelJobs
      summary: List a bid's intel jobs
      tags:
        - jobs
      security:
        - bearerAuth: []
      description: Key check, shred, compliance matrix and amendment jobs. The gateway merges these with ingest jobs. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
      responses:
        "200":
          description: The jobs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntelJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /bids/{id}/jobs/{jobId}/retry:
    post:
      operationId: retryIntelJob
      summary: Retry a failed intel job
      tags:
        - jobs
      security:
        - bearerAuth: []
      description: Only a failed job retries. A matrix run needs a credit again (402 out_of_credits). 409 retry_superseded. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The new job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryJobResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token the identity service issued (signed, verified with its JWKS). It carries user_id, tenant_id and role.
    sessionCookie:
      type: apiKey
      in: cookie
      name: e2e_session
      description: "Browser sign-in: an httpOnly cookie that holds the same access token."
    serviceAuth:
      type: http
      scheme: bearer
      description: A service token. Internal routes only, on the private network.
  responses:
    BadRequest:
      description: The request body or a parameter is not valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No valid token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PaymentRequired:
      description: The plan or the credits do not allow this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller may not do this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found. Also the answer when the id belongs to another tenant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The current state does not allow this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthResponse:
      type: object
      required:
        - service
        - version
        - schemaMigration
      properties:
        service:
          type: string
        version:
          type: string
        schemaMigration:
          type: string
          description: Name of the last applied migration for this service's schema.
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: A sentence a person can read.
        code:
          type: string
          description: A stable machine code the client can branch on, such as out_of_credits.
    Ok:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          const: true
    TabName:
      type: string
      enum:
        - overview
        - schedule
        - compliance
        - outline
        - resumes
        - reviews
        - production
        - orals
        - lessons
    RowTable:
      type: string
      enum:
        - bid_facts
        - kickoff_items
        - schedule_activities
        - compliance_rows
        - outline_items
        - personnel_requirements
        - candidates
        - resume_matches
        - reviews
        - review_assignments
        - review_findings
        - production_items
        - orals_items
        - lessons
    Bid:
      type: object
      required:
        - id
        - name
        - bidType
        - solicitationNumber
        - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        agency:
          type:
            - string
            - "null"
        bidType:
          type: string
          enum:
            - federal
            - sled
        solicitationNumber:
          type: string
          description: PENDING until the first solicitation sets it.
        solicitationKey:
          type: string
        status:
          type: string
          enum:
            - planning
            - writing
            - submitted
            - closed
        startDate:
          type:
            - string
            - "null"
          format: date-time
        dueDate:
          type:
            - string
            - "null"
          format: date-time
        dueTime:
          type:
            - string
            - "null"
        timeZone:
          type:
            - string
            - "null"
        oralsEnabled:
          type: boolean
        retentionExtendedUntil:
          type:
            - string
            - "null"
          format: date-time
        scheduleWorkdaysOnly:
          type: boolean
        creditStatus:
          type:
            - string
            - "null"
          enum:
            - reserved
            - consumed
            - released
            - null
        keyOverridesUsed:
          type: integer
        keyOverridesLeft:
          type: integer
        defaultLiveUntil:
          type:
            - string
            - "null"
          format: date-time
        filesLiveUntil:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
    CreateBidRequest:
      type: object
      required:
        - name
        - bidType
      properties:
        name:
          type: string
          minLength: 1
        bidType:
          type: string
          enum:
            - federal
            - sled
        solicitationNumber:
          type: string
          description: Optional. PENDING when absent.
    UpdateBidRequest:
      type: object
      required: []
      properties:
        name:
          type: string
        agency:
          type:
            - string
            - "null"
        bidType:
          type: string
          enum:
            - federal
            - sled
        solicitationNumber:
          type: string
        startDate:
          type:
            - string
            - "null"
          format: date-time
        dueDate:
          type:
            - string
            - "null"
          format: date-time
        dueTime:
          type:
            - string
            - "null"
        timeZone:
          type:
            - string
            - "null"
        oralsEnabled:
          type: boolean
        retentionExtendedUntil:
          type:
            - string
            - "null"
          format: date-time
        status:
          type: string
          enum:
            - planning
            - writing
            - submitted
            - closed
        scheduleWorkdaysOnly:
          type: boolean
    Row:
      type: object
      required:
        - id
        - bidId
      properties:
        id:
          type: string
          format: uuid
        bidId:
          type: string
          format: uuid
        sourcePage:
          type:
            - integer
            - "null"
          description: The page the row came from. Null only on a row a user typed.
        sourceQuote:
          type:
            - string
            - "null"
          description: The sentence the row came from. Null only on a row a user typed.
        origin:
          type: string
          description: standard, ai or user.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
    RowFields:
      type: object
      additionalProperties: true
      description: Fields of the row. The tab decides which are allowed.
    PatchRowRequest:
      type: object
      required:
        - fields
      properties:
        fields:
          type: object
          additionalProperties: true
    RowHistoryEntry:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
        rowTable:
          type: string
        rowId:
          type: string
          format: uuid
        userId:
          type:
            - string
            - "null"
          format: uuid
        userName:
          type:
            - string
            - "null"
        field:
          type: string
        changedAt:
          type: string
          format: date-time
      additionalProperties: true
    RowDetail:
      type: object
      required:
        - row
        - history
      properties:
        row:
          $ref: "#/components/schemas/Row"
        history:
          type: array
          items:
            $ref: "#/components/schemas/RowHistoryEntry"
    TabPayload:
      type: object
      additionalProperties: true
      description: "overview: facts, kickoff, proposals. compliance: rows. outline, production, orals, lessons: items. resumes: requirements, candidates, matches. reviews: reviews, assignments, findings. schedule: see ScheduleTab."
    ComplianceMatrix:
      type: object
      required:
        - rows
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/Row"
    OutlineMoveRequest:
      type: object
      required:
        - id
        - index
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type:
            - string
            - "null"
          format: uuid
        index:
          type: number
    MergeRowsRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          minItems: 2
          items:
            type: string
            format: uuid
    SplitRowRequest:
      type: object
      required:
        - rowId
        - at
      properties:
        rowId:
          type: string
          format: uuid
        at:
          type: integer
          minimum: 1
          description: Character offset inside the requirement text.
    Amendment:
      type: object
      required:
        - id
        - documentId
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        amendmentNo:
          type:
            - integer
            - "null"
        amendmentNoSource:
          type:
            - string
            - "null"
        amendmentNoFound:
          type:
            - integer
            - "null"
        status:
          type: string
          description: held, applied, failed and so on.
        tabsStatus:
          type:
            - string
            - "null"
          enum:
            - pending
            - applied
            - failed
            - null
        keyCheck:
          type: string
          enum:
            - ok
            - mismatch
            - pending
            - overridden
            - not_applicable
        keyReason:
          type:
            - string
            - "null"
        keyFound:
          type:
            - string
            - "null"
        solicitationKeyFound:
          type:
            - string
            - "null"
        keyOverride:
          type: boolean
        datesChanged:
          type:
            - object
            - "null"
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
      additionalProperties: true
    LinkedRow:
      type: object
      required:
        - rowId
        - text
      properties:
        rowId:
          type: string
          format: uuid
        label:
          type:
            - string
            - "null"
        text:
          type: string
        sourcePage:
          type:
            - integer
            - "null"
    AmendmentLink:
      type: object
      required:
        - id
        - amendmentId
        - status
      properties:
        id:
          type: string
          format: uuid
        amendmentId:
          type: string
          format: uuid
        amendmentNo:
          type:
            - integer
            - "null"
        rowTable:
          type: string
        kind:
          type: string
          description: add, supersede or withdraw.
        status:
          type: string
          enum:
            - proposed
            - confirmed
            - rejected
        oldRow:
          anyOf:
            - $ref: "#/components/schemas/LinkedRow"
            - type: "null"
        newRow:
          anyOf:
            - $ref: "#/components/schemas/LinkedRow"
            - type: "null"
        sourcePage:
          type:
            - integer
            - "null"
        sourceQuote:
          type:
            - string
            - "null"
      additionalProperties: true
    KeyOverrideRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    KeyOverrideResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
        keyOverridesLeft:
          type: integer
      additionalProperties: true
    AmendmentNoRequest:
      type: object
      required:
        - amendmentNo
      properties:
        amendmentNo:
          type: integer
          minimum: 1
          maximum: 999
    AmendmentNoResponse:
      type: object
      required:
        - ok
        - amendmentNo
      properties:
        ok:
          type: boolean
          const: true
        amendmentNo:
          type: integer
    ScheduleTab:
      type: object
      required:
        - activities
        - workdaysOnly
      properties:
        activities:
          type: array
          items:
            $ref: "#/components/schemas/Row"
        workdaysOnly:
          type: boolean
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/Row"
        pendingDateChange:
          type:
            - object
            - "null"
          additionalProperties: true
      additionalProperties: true
    AdjustRequest:
      type: object
      required:
        - mode
      properties:
        mode:
          type: string
          enum:
            - shift
            - scale
            - keep
        previousDue:
          type: string
          format: date
        nextDue:
          type: string
          format: date
        workdaysOnly:
          type: boolean
        amendmentId:
          type: string
          format: uuid
          description: Answers this amendment's date change. Then the dates come from the amendment.
    AdjustResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
        amendmentId:
          type: string
          format: uuid
        dueDate:
          type: string
          format: date
        requestedMode:
          type: string
        mode:
          type: string
        workdaysOnly:
          type: boolean
        unit:
          type: string
        delta:
          type: number
        moved:
          type: integer
        moves:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    CheckThese:
      type: object
      required:
        - id
        - documentId
        - sentence
        - page
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        sentence:
          type: string
        page:
          type: integer
          description: The source page of the sentence.
    BidFit:
      type: object
      required:
        - bidId
        - score
        - factors
      properties:
        bidId:
          type: string
          format: uuid
        score:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 100
        recommendation:
          type:
            - string
            - "null"
          enum:
            - bid
            - no_bid
            - review
            - null
        factors:
          type: array
          items:
            type: object
            required:
              - name
              - score
            properties:
              name:
                type: string
              score:
                type: number
              note:
                type:
                  - string
                  - "null"
              sourcePage:
                type:
                  - integer
                  - "null"
              sourceQuote:
                type:
                  - string
                  - "null"
            additionalProperties: true
        scoredAt:
          type:
            - string
            - "null"
          format: date-time
      additionalProperties: true
    IntelJob:
      type: object
      required:
        - id
        - type
        - status
      properties:
        id:
          type: string
          format: uuid
        bidId:
          type:
            - string
            - "null"
          format: uuid
        documentId:
          type:
            - string
            - "null"
          format: uuid
        type:
          type: string
          description: key_check, shred, matrix or amendment.
        status:
          type: string
          enum:
            - pending
            - running
            - completed
            - failed
        progress:
          type: integer
          minimum: 0
          maximum: 100
        error:
          type:
            - string
            - "null"
        startedAt:
          type:
            - string
            - "null"
          format: date-time
        finishedAt:
          type:
            - string
            - "null"
          format: date-time
        stage:
          type:
            - string
            - "null"
        queuePosition:
          type:
            - integer
            - "null"
        queueDepth:
          type: integer
        etaSeconds:
          type:
            - integer
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
    RetryJobResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
