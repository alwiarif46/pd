openapi: 3.1.0
info:
  title: Solicitation intel service
  version: 0.2.0
  description: "Every secured route takes a bearer access token (Authorization header) or the e2e_session cookie. Either one works. CSRF: a request authenticated by the cookie must send the header X-Requested-With: e2e on POST, PATCH, PUT and DELETE, or it answers 403. Bearer requests may omit it. List routes accept limit and cursor and return X-Next-Cursor while more rows remain. The body stays a plain array."
x-service: intel
security:
  - bearerAuth: []
  - sessionCookie: []
tags:
  - name: bids
    description: Bids and the bid/no-bid score.
  - name: rows
    description: Tabs and their rows.
  - name: amendments
    description: Amendments and their row changes.
  - name: schedule
    description: Dates and the schedule.
  - name: check-these
    description: Sentences the matrix may have missed.
  - name: jobs
    description: Intel jobs.
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness and schema migration level
      security: []
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /bids:
    get:
      operationId: listBids
      summary: List the tenant's bids
      tags:
        - bids
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The bids.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bid"
          headers:
            X-Next-Cursor:
              $ref: "#/components/headers/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createBid
      summary: Create a bid
      tags:
        - bids
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: The tenant comes from the verified token. No tenant id is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBidRequest"
      responses:
        "201":
          description: The bid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bid"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
  /bids/{id}:
    get:
      operationId: getBid
      summary: Get a bid
      tags:
        - bids
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
      responses:
        "200":
          description: The bid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateBid
      summary: Change a bid
      tags:
        - bids
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: A new solicitation number rechecks held amendments. 409 key_locked once the bid holds a credit for its number. Extending file retention is owner only (403 owner_only) and needs a paid plan (402 plan_required). The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBidRequest"
      responses:
        "200":
          description: The bid after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bid"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
    delete:
      operationId: deleteBid
      summary: Delete a bid
      tags:
        - bids
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Removes the bid and its rows, then emits intel.bid.deleted. Ingest deletes the bid's documents when it gets the event. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
  /bids/{id}/tabs/{tab}:
    get:
      operationId: getBidTab
      summary: Read a tab
      tags:
        - rows
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: The rows of one tab. Every AI-extracted row carries sourcePage and sourceQuote. An unknown tab is 404. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - name: tab
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TabName"
      responses:
        "200":
          description: The tab's rows. The shape depends on the tab.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TabPayload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /bids/{id}/tabs/{tab}/rows:
    post:
      operationId: createTabRow
      summary: Add a row to a tab
      tags:
        - rows
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - name: tab
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TabName"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RowFields"
      responses:
        "201":
          description: The new row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Row"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
  /bids/{id}/tabs/{tab}/seed:
    post:
      operationId: seedTab
      summary: Seed a tab with its standard rows
      tags:
        - rows
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Overview, production, orals and lessons get their standard rows once. Schedule applies a template counted back from the due date (409 due_date_required, 409 schedule_template_exists). Seeding twice adds nothing. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - name: tab
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TabName"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeedRequest"
      responses:
        "200":
          description: Seeded. The schedule answers with the template result.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Ok"
                  - $ref: "#/components/schemas/ScheduleSeedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
  /bids/{id}/rows/{table}/{rowId}:
    get:
      operationId: getRow
      summary: Read a row and its history
      tags:
        - rows
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - name: table
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RowTable"
        - name: rowId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RowDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateRow
      summary: Change fields of a row
      tags:
        - rows
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Typed fields reject values outside their lists with 400. Every change writes row history. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - name: table
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RowTable"
        - name: rowId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchRowRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
    delete:
      operationId: deleteRow
      summary: Delete a row
      tags:
        - rows
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - name: table
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RowTable"
        - name: rowId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
  /bids/{id}/outline/move:
    post:
      operationId: moveOutlineItem
      summary: Move an outline item
      tags:
        - rows
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutlineMoveRequest"
      responses:
        "200":
          description: The whole outline in its new order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutlineItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
  /bids/{id}/matrix:
    get:
      operationId: getComplianceMatrix
      summary: Read the compliance matrix
      tags:
        - rows
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: The compliance rows of the bid, the same rows as the compliance tab. Each row has sourcePage and sourceQuote. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
      responses:
        "200":
          description: The matrix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceMatrix"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /bids/{id}/compliance/merge:
    post:
      operationId: mergeComplianceRows
      summary: Merge compliance rows
      tags:
        - rows
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Keeps the first row and joins the text of the others. Open amendment proposals that name a merged row are rejected. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeRowsRequest"
      responses:
        "200":
          description: The kept row.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
  /bids/{id}/compliance/split:
    post:
      operationId: splitComplianceRow
      summary: Split a compliance row
      tags:
        - rows
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitRowRequest"
      responses:
        "201":
          description: The new second row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceRow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
  /bids/{id}/amendments:
    get:
      operationId: listAmendments
      summary: List a bid's amendments
      tags:
        - amendments
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Each amendment with its number, status, key check and date change. The web joins these with ingest documents for the Documents tab. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The amendments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Amendment"
          headers:
            X-Next-Cursor:
              $ref: "#/components/headers/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /bids/{id}/amendments/{documentId}/key-override:
    post:
      operationId: overrideAmendmentKey
      summary: Accept an amendment despite its solicitation number
      tags:
        - amendments
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: "A reason is required (400). Each bid has a fixed number of overrides, never refunded. 409 codes: override_not_needed, override_limit, set_bid_number_first, solicitation_first, document_deleted, not_an_amendment. Owner only. The tenant comes from the verified token. No tenant id is sent."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The amendment's document id.
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyOverrideRequest"
      responses:
        "200":
          description: The override is recorded and processing resumes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyOverrideResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-roles:
        - owner
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
  /bids/{id}/amendments/{documentId}/amendment-no:
    patch:
      operationId: setAmendmentNo
      summary: Set an amendment's number
      tags:
        - amendments
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: 400 invalid_amendment_no outside 1 to 999. 409 amendment_no_taken, document_deleted or not_an_amendment. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The amendment's document id.
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmendmentNoRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmendmentNoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
  /bids/{id}/amendment-links:
    get:
      operationId: listAmendmentLinks
      summary: List an amendment's proposed row changes
      tags:
        - amendments
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Each link names the old and new row and carries sourcePage and sourceQuote from the amendment text. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The links.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AmendmentLink"
          headers:
            X-Next-Cursor:
              $ref: "#/components/headers/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /amendment-links/{id}/confirm:
    post:
      operationId: confirmAmendmentLink
      summary: Confirm a proposed change
      tags:
        - amendments
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Decisions are final. The same decision again answers 200. 409 link_already_decided, row_already_closed or new_row_missing. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmendmentLinkDecision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
  /amendment-links/{id}/reject:
    post:
      operationId: rejectAmendmentLink
      summary: Reject a proposed change
      tags:
        - amendments
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Decisions are final. The same decision again answers 200. 409 link_already_decided. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmendmentLinkDecision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
  /bids/{id}/schedule:
    get:
      operationId: getSchedule
      summary: Read the schedule
      tags:
        - schedule
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: "The same payload as the schedule tab: activities by start date, the workdays setting, amendment proposals and the pending date change. The tenant comes from the verified token. No tenant id is sent."
