components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token the identity service issued (signed, verified with its JWKS). It carries user_id, tenant_id and role.
    sessionCookie:
      type: apiKey
      in: cookie
      name: e2e_session
      description: "Browser sign-in: an httpOnly cookie that holds the same access token."
    serviceAuth:
      type: http
      scheme: bearer
      description: A service token. Internal routes only, on the private network.
  parameters:
    CsrfHeader:
      name: X-Requested-With
      in: header
      required: false
      schema:
        type: string
        const: e2e
      description: Required with the value e2e on a write request that the cookie authenticates. Not needed with a bearer token.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Page size.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: The X-Next-Cursor value of the previous page.
  headers:
    NextCursor:
      description: Present when more rows remain. Send it as cursor to get the next page.
      schema:
        type: string
  responses:
    BadRequest:
      description: The request body or a parameter is not valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No valid token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PaymentRequired:
      description: The plan or the credits do not allow this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller may not do this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found. Also the answer when the id belongs to another tenant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The current state does not allow this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: The feature is not configured on this deployment (billing_unavailable).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthResponse:
      type: object
      required:
        - service
        - version
        - schemaMigration
      properties:
        service:
          type: string
        version:
          type: string
        schemaMigration:
          type: string
          description: Name of the last applied migration for this service's schema.
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: A sentence a person can read.
        code:
          type: string
          description: A stable machine code the client can branch on, such as out_of_credits.
    Ok:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          const: true
    TabName:
      type: string
      enum:
        - overview
        - schedule
        - compliance
        - outline
        - resumes
        - reviews
        - production
        - orals
        - lessons
    RowTable:
      type: string
      enum:
        - bid_facts
        - kickoff_items
        - schedule_activities
        - compliance_rows
        - outline_items
        - personnel_requirements
        - candidates
        - resume_matches
        - reviews
        - review_assignments
        - review_findings
        - production_items
        - orals_items
        - lessons
    Bid:
      type: object
      required:
        - id
        - name
        - bidType
        - solicitationNumber
        - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        agency:
          type:
            - string
            - "null"
        bidType:
          type: string
          enum:
            - federal
            - sled
        solicitationNumber:
          type: string
          description: PENDING until the first solicitation sets it.
        solicitationKey:
          type: string
        status:
          type: string
