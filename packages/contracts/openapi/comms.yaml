openapi: 3.1.0
info:
  title: E2E Proposal comms service
  version: 0.1.0
paths:
  /health:
    get:
      operationId: commsHealth
      summary: Liveness check
      responses:
        "200":
          description: The service is up
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: comms
