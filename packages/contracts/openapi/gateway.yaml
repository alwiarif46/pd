    TabPayload:
      description: The body depends on the tab path parameter (PD's TabPayloadMap). The body has no tab field, so the discriminator is the path parameter.
      x-discriminator:
        in: path
        parameter: tab
        mapping:
          overview: OverviewTab
          schedule: ScheduleTab
          compliance: ComplianceTab
          outline: OutlineTab
          resumes: ResumesTab
          reviews: ReviewsTab
          production: ProductionTab
          orals: OralsTab
          lessons: LessonsTab
      oneOf:
        - $ref: "#/components/schemas/OverviewTab"
        - $ref: "#/components/schemas/ScheduleTab"
        - $ref: "#/components/schemas/ComplianceTab"
        - $ref: "#/components/schemas/OutlineTab"
        - $ref: "#/components/schemas/ResumesTab"
        - $ref: "#/components/schemas/ReviewsTab"
        - $ref: "#/components/schemas/ProductionTab"
        - $ref: "#/components/schemas/OralsTab"
        - $ref: "#/components/schemas/LessonsTab"
