          description: The provider, model and subprocessors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingInfo"
      x-upstream: gateway
  /api/billing/checkout:
    post:
      operationId: createCheckoutSession
      summary: Start Stripe Checkout for a paid plan
      tags:
        - billing
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Returns the Stripe Checkout URL. 409 when the tenant already has a paid plan. 503 billing_unavailable when Stripe is not configured. Owner only. The tenant comes from the verified token. No tenant id is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: The Checkout URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UrlResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-roles:
        - owner
      x-upstream: billing
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
  /api/billing/portal:
    post:
      operationId: createPortalSession
      summary: Open the Stripe billing portal
      tags:
        - billing
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Returns the portal URL. 409 no_billing_account before the first upgrade. 503 billing_unavailable when Stripe is not configured. Owner only. The tenant comes from the verified token. No tenant id is sent.
      responses:
        "200":
          description: The portal URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UrlResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-roles:
        - owner
      x-upstream: billing
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
  /api/billing/webhook:
    post:
      operationId: receiveStripeWebhook
      summary: Stripe webhook
      tags:
        - billing
      security: []
      description: Public. Stripe calls it. The body is the raw bytes Stripe signed, so the gateway passes it on unparsed. A missing or wrong signature is 400. 503 billing_unavailable when the webhook secret is not set.
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
          description: Stripe signature of the raw body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The event is accepted (or ignored).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      x-upstream: billing
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token the identity service issued (signed, verified with its JWKS). It carries user_id, tenant_id and role.
    sessionCookie:
      type: apiKey
      in: cookie
      name: e2e_session
      description: "Browser sign-in: an httpOnly cookie that holds the same access token."
    serviceAuth:
      type: http
      scheme: bearer
      description: A service token. Internal routes only, on the private network.
  parameters:
    CsrfHeader:
      name: X-Requested-With
      in: header
      required: false
      schema:
        type: string
        const: e2e
      description: Required with the value e2e on a write request that the cookie authenticates. Not needed with a bearer token.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Page size.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: The X-Next-Cursor value of the previous page.
  headers:
    NextCursor:
      description: Present when more rows remain. Send it as cursor to get the next page.
      schema:
        type: string
  responses:
    BadRequest:
      description: The request body or a parameter is not valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No valid token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PaymentRequired:
      description: The plan or the credits do not allow this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller may not do this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found. Also the answer when the id belongs to another tenant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The current state does not allow this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: The feature is not configured on this deployment (billing_unavailable).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthResponse:
      type: object
      required:
        - service
        - version
        - schemaMigration
      properties:
        service:
          type: string
        version:
          type: string
        schemaMigration:
          type: string
          description: Name of the last applied migration for this service's schema.
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: A sentence a person can read.
        code:
          type: string
          description: A stable machine code the client can branch on, such as out_of_credits.
    Ok:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          const: true
    Role:
      type: string
      enum:
        - owner
        - member
    Tenant:
      type: object
      required:
        - id
        - name
        - plan
        - planStatus
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        emailDomain:
          type:
            - string
            - "null"
        plan:
          type: string
          description: The plan id. Billing owns the plan; identity mirrors it.
        planStatus:
          type: string
        cycleStart:
          type:
            - string
            - "null"
          format: date-time
        cycleEnd:
          type:
            - string
            - "null"
          format: date-time
        freeFirstMonthEnds:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TenantView:
      type: object
      required:
        - tenant
        - role
        - seatLimit
      properties:
        tenant:
          $ref: "#/components/schemas/Tenant"
        role:
          $ref: "#/components/schemas/Role"
        seatLimit:
          type: integer
        mbCap:
          type: integer
          description: Largest upload for the plan, in megabytes.
    CreateTenantRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
    UpdateTenantRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
    Member:
      type: object
      required:
        - userId
        - email
        - role
        - joinedAt
        - isYou
        - seatLocked
      properties:
        orgId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type:
            - string
            - "null"
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        joinedAt:
          type: string
          format: date-time
        isYou:
          type: boolean
        seatLocked:
          type: boolean
      description: orgId is the tenant id.
    CreateTenantResponse:
      type: object
      required:
        - id
        - name
        - plan
        - token
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        plan:
          type: string
        token:
          type: string
          description: A fresh access token that carries the new tenant.
        expiresAt:
          type: string
          format: date-time
    CreateInviteRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: A work address. Free mail domains are refused.
    AcceptInviteRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: '"<tenantId>.<64 hex token>".'
    AcceptInviteResponse:
      type: object
      required:
        - orgId
        - name
        - role
        - alreadyMember
        - token
        - expiresAt
      properties:
        orgId:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        alreadyMember:
          type: boolean
        token:
          type: string
          description: A fresh access token that carries the tenant.
        expiresAt:
          type: string
          format: date-time
    Me:
      type: object
      required:
        - id
        - email
        - name
        - orgId
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type:
            - string
            - "null"
        orgId:
          type:
            - string
            - "null"
          format: uuid
          description: The tenant id, or null before the user has a tenant.
        role:
          anyOf:
            - $ref: "#/components/schemas/Role"
            - type: "null"
    UpdateMeRequest:
      type: object
      required: []
      properties:
        name:
          type: string
    LogoutResponse:
      type: object
      required:
        - endSessionUrl
      properties:
        endSessionUrl:
          type: string
          format: uri
    VerifyTokenRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    TokenClaims:
      type: object
      required:
        - userId
        - tenantId
        - role
        - seatLocked
        - expiresAt
      properties:
        userId:
          type: string
          format: uuid
        zitadelUserId:
          type: string
          description: The Zitadel user id, when the mirror has it.
        tenantId:
          type:
            - string
            - "null"
          format: uuid
        role:
          anyOf:
            - $ref: "#/components/schemas/Role"
            - type: "null"
        seatLocked:
          type: boolean
          description: True when the plan has no seat for this member.
        expiresAt:
          type: string
          format: date-time
    Jwks:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            type: object
            required:
              - kty
              - kid
            properties:
              kty:
                type: string
              kid:
                type: string
              use:
                type: string
              alg:
                type: string
              n:
                type: string
              e:
                type: string
            additionalProperties: true
    FileKind:
