      tags:
        - composition
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Composed by the gateway from ingest (GET /bids/{id}/jobs) and intel (GET /bids/{id}/jobs). Each job says which service ran it. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
