openapi: 3.1.0
info:
  title: Gateway and web service
  version: 0.3.0
  description: "The public surface under /api. Each route forwards to the owning service (x-upstream), which has the same path without /api. This file copies the service schemas; it is standalone on purpose. GET /api/org keeps its PD name. GET /healthz (not under /api) replaces PD's /health. Every secured route takes a bearer access token (Authorization header) or the e2e_session cookie. Either one works. CSRF: a request authenticated by the cookie must send the header X-Requested-With: e2e on POST, PATCH, PUT and DELETE, or it answers 403. Bearer requests may omit it. List routes accept limit and cursor and return X-Next-Cursor while more rows remain. The body stays a plain array."
x-service: gateway
security:
  - bearerAuth: []
  - sessionCookie: []
tags:
  - name: composition
    description: Routes the gateway builds from more than one service.
  - name: tenants
    description: "Identity: the tenant."
  - name: members
    description: "Identity: members."
  - name: invites
    description: "Identity: invites."
  - name: me
    description: "Identity: the user."
  - name: auth
    description: "Identity: OIDC sign-in."
  - name: billing
    description: "Billing: Checkout, portal and the Stripe webhook."
  - name: uploads
    description: "Ingest: uploads."
  - name: documents
    description: "Ingest: documents."
  - name: jobs
    description: "Ingest and intel: jobs."
  - name: bids
    description: "Intel: bids."
  - name: rows
    description: "Intel: tabs and rows."
  - name: amendments
    description: "Intel: amendments."
  - name: schedule
    description: "Intel: schedule."
  - name: check-these
    description: "Intel: check these."
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness and schema migration level
      security: []
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
      x-note: Not under /api. Replaces PD's /health.
  /api/members:
    get:
      operationId: listMembers
      summary: List the tenant's members
      tags:
        - members
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Members past the plan's seats carry seatLocked. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The members, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
          headers:
            X-Next-Cursor:
              $ref: "#/components/headers/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
      x-upstream: identity
  /api/members/{userId}/owner:
    post:
      operationId: transferOwnership
      summary: Make a member the owner
      tags:
        - members
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: The caller becomes a member. 400 when userId is the caller. A user id from another tenant answers 404. Emits identity.role.changed twice. Owner only. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Ownership moved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-roles:
        - owner
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
      x-upstream: identity
  /api/members/{userId}:
    delete:
      operationId: removeMember
      summary: Remove a member
      tags:
        - members
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: "The owner cannot remove themself: transfer ownership first. Emits identity.user.removed. Owner only. The tenant comes from the verified token. No tenant id is sent."
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-roles:
        - owner
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
      x-upstream: identity
  /api/invites:
    post:
      operationId: createInvite
      summary: Invite a member by work email
      tags:
        - invites
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Holds a seat until accepted or expired (7 days). 402 when the plan has no seat left. 409 invite_pending when the email has an open invite. The code goes out of band to the invitee, never in the response. Owner only. The tenant comes from the verified token. No tenant id is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: The invite is sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
      x-roles:
        - owner
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
      x-upstream: identity
  /api/invites/accept:
    post:
      operationId: acceptInvite
      summary: Accept an invite
      tags:
        - invites
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: "The caller has a token but no tenant yet. On success it sets a fresh e2e_session cookie and returns a fresh token that carries the tenant (no separate refresh route; silent re-login covers expiry). Error codes: invite_invalid (404), invite_email_mismatch (403), invite_used, invite_expired, already_in_org, seats_full (409). A foreign or guessed code is invite_invalid."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "200":
          description: The caller joined, or already was a member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptInviteResponse"
          headers:
            Set-Cookie:
              schema:
                type: string
              description: e2e_session, httpOnly, Secure, SameSite=Lax.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
      x-upstream: identity
  /api/me:
    get:
      operationId: getMe
      summary: Get the signed-in user
      tags:
        - me
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: The tenant comes from the verified token. No tenant id is sent.
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
      x-upstream: identity
    patch:
      operationId: updateMe
      summary: Change the user's name
      tags:
        - me
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Only the name changes here. Zitadel owns credentials, MFA factors and passkeys. The tenant comes from the verified token. No tenant id is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
      x-upstream: identity
  /api/auth/login:
    get:
      operationId: authLogin
      summary: Start the OIDC code flow
      tags:
        - auth
      security: []
      description: "Redirects the browser to Zitadel (authorization code with PKCE). Zitadel serves the login, MFA, passkey and SSO screens. No password reaches this service. Public: no token needed."
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            pattern: ^/(?![/\\])
          description: A path in the web app to return to. Absolute URLs are refused.
      responses:
        "302":
          description: Redirect to Zitadel.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/BadRequest"
      x-upstream: identity
  /api/auth/callback:
    get:
      operationId: authCallback
      summary: Finish the OIDC code flow
      tags:
        - auth
      security: []
      description: "Exchanges the code for tokens, upserts the user mirror, sets the e2e_session cookie and redirects to returnTo. A wrong state is 400. Public: no token needed."
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: The authorization code from Zitadel.
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: The state the login step set.
      responses:
        "302":
          description: Signed in. Redirect to the web app.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: e2e_session, httpOnly, Secure, SameSite=Lax.
        "400":
          $ref: "#/components/responses/BadRequest"
      x-upstream: identity
  /api/auth/logout:
    post:
      operationId: authLogout
      summary: Sign out
      tags:
        - auth
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Clears the cookie and returns the Zitadel end-session URL for the browser to visit.
      responses:
        "200":
          description: Signed out here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
      x-upstream: identity
  /api/bids/{id}/uploads:
    post:
      operationId: createUpload
      summary: Start a chunked upload on a bid
      tags:
        - uploads
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: "Checks the key, the bid size cap and the credit (through the billing bridge), then opens a session that lasts a day. An identical file already on the bid answers 200 with duplicate true and charges nothing. Errors: invalid_upload (400), out_of_credits (402), key_mismatch, key_required, solicitation_first, bid_cap_exceeded, amendment_no_taken (409). The bid must belong to the caller's tenant, else 404. The tenant comes from the verified token. No tenant id is sent."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "200":
          description: The file is already on the bid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateUpload"
        "201":
          description: The session is open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
      x-upstream: ingest
  /api/uploads/{id}:
    delete:
      operationId: cancelUpload
      summary: Cancel an open upload
      tags:
        - uploads
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Releases the credit the session reserved and removes the chunks. Only an open session can be cancelled. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelUploadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
      x-upstream: ingest
  /api/uploads/{id}/chunks/{index}:
    put:
      operationId: putUploadChunk
      summary: Send one chunk
      tags:
        - uploads
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: One chunk of 1 byte to 20 MB. Sending a chunk twice is safe. An index past chunkCount is 400. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
          description: Zero-based chunk number.
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
      x-upstream: ingest
  /api/uploads/{id}/complete:
    post:
      operationId: completeUpload
      summary: Finish an upload
      tags:
        - uploads
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Joins the chunks, checks the size and the sha256, creates the document and queues the scan job. A second call answers 409. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "201":
          description: The document exists and the scan is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
      x-upstream: ingest
  /api/bids/{id}/documents:
    get:
      operationId: listBidDocuments
      summary: List a bid's documents
      tags:
        - documents
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: "Each document carries what the Documents tab shows from ingest: liveUntil, restoredUntil and markingPage. The key check and amendment status live in intel (GET /bids/{id}/amendments). The tenant comes from the verified token. No tenant id is sent."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The documents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
          headers:
            X-Next-Cursor:
              $ref: "#/components/headers/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      x-upstream: ingest
  /api/documents/{id}/view-token:
    get:
      operationId: createViewToken
      summary: Get a one-hour viewer token
      tags:
        - documents
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      x-upstream: ingest
  /api/documents/view/{token}:
    get:
      operationId: resolveViewToken
      summary: Resolve a viewer token
      tags:
        - documents
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Returns the document the token names. An unknown or expired token is 404. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The document id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewTokenTarget"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      x-upstream: ingest
  /api/documents/{id}/pages:
    get:
      operationId: listDocumentPages
      summary: Read page text
      tags:
        - documents
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Page text stays after the file is deleted, so source quotes keep resolving. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: to
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Defaults to from.
      responses:
        "200":
          description: The pages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      x-upstream: ingest
  /api/documents/{id}/file:
    get:
      operationId: getDocumentFile
      summary: Download the viewer PDF
      tags:
        - documents
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Streams the viewer copy. 410 when the file was deleted, 409 while it is archived or being restored. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: The file was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-upstream: ingest
  /api/documents/{id}/restore:
    post:
      operationId: restoreDocument
      summary: Ask for an archived file back
      tags:
        - documents
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Moves archived to restore_requested. A second call while a restore is pending answers with the current status. 402 plan_required when the plan does not allow restores. 409 no_archive_copy or not archived. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: The status after the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
      x-upstream: ingest
  /api/documents/{id}/confirm-marking:
    post:
      operationId: confirmDocumentMarking
      summary: Confirm a held file
      tags:
        - documents
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: A file the marking check blocked waits for this. It queues the classify job and writes an audit record. 409 when classified or not waiting. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
      x-upstream: ingest
  /api/documents/{id}:
    delete:
      operationId: deleteDocument
      summary: Delete a document
      tags:
        - documents
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Removes the stored file and keeps page text. Emits ingest.document.deleted, which intel uses to drop rows and to settle the credit. Deleting twice is fine. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteDocumentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-csrf: "X-Requested-With: e2e is required when the cookie authenticates the request."
      x-upstream: ingest
  /api/jobs/{id}/retry:
    post:
      operationId: retryIngestJob
