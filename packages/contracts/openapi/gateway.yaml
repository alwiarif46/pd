      required:
        - bidId
        - score
        - factors
      properties:
        bidId:
          type: string
          format: uuid
        score:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 100
        recommendation:
          type:
            - string
            - "null"
          enum:
            - bid
            - no_bid
            - review
            - null
        factors:
          type: array
          items:
            type: object
            required:
              - name
              - score
            properties:
              name:
                type: string
              score:
                type: number
              note:
                type:
                  - string
                  - "null"
              sourcePage:
                type:
                  - integer
                  - "null"
              sourceQuote:
                type:
                  - string
                  - "null"
            additionalProperties: true
        scoredAt:
          type:
            - string
            - "null"
          format: date-time
      additionalProperties: true
    IntelJob:
      type: object
      required:
        - id
        - type
        - status
      properties:
        id:
          type: string
          format: uuid
        bidId:
          type:
            - string
            - "null"
          format: uuid
        documentId:
          type:
            - string
            - "null"
          format: uuid
        type:
          type: string
          description: key_check, shred, matrix or amendment.
        status:
          type: string
          enum:
            - pending
            - running
            - completed
            - failed
        progress:
          type: integer
          minimum: 0
          maximum: 100
        error:
          type:
            - string
            - "null"
        startedAt:
          type:
            - string
            - "null"
          format: date-time
        finishedAt:
          type:
            - string
            - "null"
          format: date-time
        stage:
          type:
            - string
            - "null"
        queuePosition:
          type:
            - integer
            - "null"
        queueDepth:
          type: integer
        etaSeconds:
          type:
            - integer
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
    OrgView:
      type: object
      required:
        - org
        - credits
        - role
        - seatLimit
        - billingAvailable
      properties:
        org:
          anyOf:
            - $ref: "#/components/schemas/Tenant"
            - type: "null"
        credits:
          anyOf:
            - $ref: "#/components/schemas/CreditPeriod"
            - type: "null"
        role:
          $ref: "#/components/schemas/Role"
        seatLimit:
          type: integer
        mbCap:
          type: integer
        billingAvailable:
          type: boolean
    CreditPeriod:
      type: object
      required:
        - periodStart
        - periodEnd
        - allowed
        - used
        - reserved
      properties:
        id:
          type:
            - string
            - "null"
          format: uuid
          description: Null while the period has no row yet. Then allowed is the plan's allowance.
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        allowed:
          type: integer
        used:
          type: integer
        reserved:
          type: integer
      additionalProperties: true
    BidJob:
      allOf:
        - anyOf:
            - $ref: "#/components/schemas/IngestJob"
            - $ref: "#/components/schemas/IntelJob"
        - type: object
          required:
            - service
          properties:
            service:
              type: string
              enum:
                - ingest
                - intel
          additionalProperties: true
    ProcessingInfo:
      type: object
      required:
        - provider
        - model
        - subprocessors
        - privacyPath
      properties:
        provider:
          type: string
        model:
          type: string
        subprocessors:
          type: array
          items:
            type: string
        privacyPath:
          type: string
