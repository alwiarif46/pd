openapi: 3.1.0
info:
  title: Gateway and web service
  version: 0.2.0
  description: The public surface under /api. Each route forwards to the owning service, which has the same path without /api. This file copies the service schemas; it is standalone on purpose.
x-service: gateway
security:
  - bearerAuth: []
tags:
  - name: composition
    description: Routes the gateway builds from more than one service.
  - name: tenants
    description: "Identity: the tenant."
  - name: members
    description: "Identity: members."
  - name: invites
    description: "Identity: invites."
  - name: me
    description: "Identity: the user."
  - name: auth
    description: "Identity: OIDC sign-in."
  - name: uploads
    description: "Ingest: uploads."
  - name: documents
    description: "Ingest: documents."
  - name: jobs
    description: "Ingest and intel: jobs."
  - name: bids
    description: "Intel: bids."
  - name: rows
    description: "Intel: tabs and rows."
  - name: amendments
    description: "Intel: amendments."
  - name: schedule
    description: "Intel: schedule."
  - name: check-these
    description: "Intel: check these."
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness and schema migration level
      security: []
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
      x-note: Not under /api.
  /api/members:
    get:
      operationId: listMembers
      summary: List the tenant's members
      tags:
        - members
      security:
        - bearerAuth: []
      description: Members past the plan's seats carry seatLocked. The tenant comes from the verified token. No tenant id is sent.
      responses:
        "200":
          description: The members, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/members/{userId}:
    delete:
      operationId: removeMember
      summary: Remove a member
      tags:
        - members
      security:
        - bearerAuth: []
      description: "The owner cannot remove themself: transfer ownership first. Emits identity.user.removed. Owner only. The tenant comes from the verified token. No tenant id is sent."
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-roles:
        - owner
  /api/invites:
    post:
      operationId: createInvite
      summary: Invite a member by work email
      tags:
        - invites
      security:
        - bearerAuth: []
      description: Holds a seat until accepted or expired (7 days). 402 when the plan has no seat left. 409 invite_pending when the email has an open invite. The code goes out of band to the invitee, never in the response. Owner only. The tenant comes from the verified token. No tenant id is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: The invite is sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
      x-roles:
        - owner
  /api/invites/accept:
    post:
      operationId: acceptInvite
      summary: Accept an invite
      tags:
        - invites
      security:
        - bearerAuth: []
      description: "The caller has a token but no tenant yet. Error codes: invite_invalid (404), invite_email_mismatch (403), invite_used, invite_expired, already_in_org, seats_full (409). A foreign or guessed code is invite_invalid. The tenant comes from the verified token. No tenant id is sent."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "200":
          description: The caller joined, or already was a member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptInviteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/me:
    get:
      operationId: getMe
      summary: Get the signed-in user
      tags:
        - me
      security:
        - bearerAuth: []
      description: The tenant comes from the verified token. No tenant id is sent.
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      summary: Change the user's name
      tags:
        - me
      security:
        - bearerAuth: []
      description: Only the name changes here. Zitadel owns credentials, MFA factors and passkeys. The tenant comes from the verified token. No tenant id is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/login:
    get:
      operationId: authLogin
      summary: Start the OIDC code flow
      tags:
        - auth
      security: []
      description: "Redirects the browser to Zitadel (authorization code with PKCE). Zitadel serves the login, MFA, passkey and SSO screens. No password reaches this service. Public: no token needed."
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            pattern: ^/
          description: A path in the web app to return to. Absolute URLs are refused.
      responses:
        "302":
          description: Redirect to Zitadel.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/auth/callback:
    get:
      operationId: authCallback
      summary: Finish the OIDC code flow
      tags:
        - auth
      security: []
      description: "Exchanges the code for tokens, upserts the user mirror, sets the e2e_session cookie and redirects to returnTo. A wrong state is 400. Public: no token needed."
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: The authorization code from Zitadel.
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: The state the login step set.
      responses:
        "302":
          description: Signed in. Redirect to the web app.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: e2e_session, httpOnly, Secure, SameSite=Lax.
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/auth/logout:
    post:
      operationId: authLogout
      summary: Sign out
      tags:
        - auth
      security:
        - bearerAuth: []
        - sessionCookie: []
      description: Clears the cookie and returns the Zitadel end-session URL for the browser to visit. The tenant comes from the verified token. No tenant id is sent.
      responses:
        "200":
          description: Signed out here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/bids/{id}/uploads:
    post:
      operationId: createUpload
      summary: Start a chunked upload on a bid
      tags:
        - uploads
      security:
        - bearerAuth: []
      description: "Checks the key, the bid size cap and the credit (through the billing bridge), then opens a session that lasts a day. An identical file already on the bid answers 200 with duplicate true and charges nothing. Errors: invalid_upload (400), out_of_credits (402), key_mismatch, key_required, solicitation_first, bid_cap_exceeded, amendment_no_taken (409). The bid must belong to the caller's tenant, else 404. The tenant comes from the verified token. No tenant id is sent."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "200":
          description: The file is already on the bid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateUpload"
        "201":
          description: The session is open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/uploads/{id}:
    delete:
      operationId: cancelUpload
      summary: Cancel an open upload
      tags:
        - uploads
      security:
        - bearerAuth: []
      description: Releases the credit the session reserved and removes the chunks. Only an open session can be cancelled. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelUploadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/uploads/{id}/chunks/{index}:
    put:
      operationId: putUploadChunk
      summary: Send one chunk
      tags:
        - uploads
      security:
        - bearerAuth: []
      description: One chunk of 1 byte to 20 MB. Sending a chunk twice is safe. An index past chunkCount is 400. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
          description: Zero-based chunk number.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/uploads/{id}/complete:
    post:
      operationId: completeUpload
      summary: Finish an upload
      tags:
        - uploads
      security:
        - bearerAuth: []
      description: Joins the chunks, checks the size and the sha256, creates the document and queues the scan job. A second call answers 409. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: The document exists and the scan is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/bids/{id}/documents:
    get:
      operationId: listBidDocuments
      summary: List a bid's documents
      tags:
        - documents
      security:
        - bearerAuth: []
      description: "Each document carries what the Documents tab shows from ingest: liveUntil, restoredUntil and markingPage. The key check and amendment status live in intel (GET /bids/{id}/amendments). The tenant comes from the verified token. No tenant id is sent."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
      responses:
        "200":
          description: The documents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/documents/{id}/view-token:
    get:
      operationId: createViewToken
      summary: Get a one-hour viewer token
      tags:
        - documents
      security:
        - bearerAuth: []
      description: The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/documents/view/{token}:
    get:
      operationId: resolveViewToken
      summary: Resolve a viewer token
      tags:
        - documents
      security:
        - bearerAuth: []
      description: Returns the document the token names. An unknown or expired token is 404. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The document id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewTokenTarget"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/documents/{id}/pages:
    get:
      operationId: listDocumentPages
      summary: Read page text
      tags:
        - documents
      security:
        - bearerAuth: []
      description: Page text stays after the file is deleted, so source quotes keep resolving. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: to
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Defaults to from.
      responses:
        "200":
          description: The pages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/documents/{id}/file:
    get:
      operationId: getDocumentFile
      summary: Download the viewer PDF
      tags:
        - documents
      security:
        - bearerAuth: []
      description: Streams the viewer copy. 410 when the file was deleted, 409 while it is archived or being restored. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: The file was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/documents/{id}/restore:
    post:
      operationId: restoreDocument
      summary: Ask for an archived file back
      tags:
        - documents
      security:
        - bearerAuth: []
      description: Moves archived to restore_requested. A second call while a restore is pending answers with the current status. 402 plan_required when the plan does not allow restores. 409 no_archive_copy or not archived. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The status after the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/documents/{id}/confirm-marking:
    post:
      operationId: confirmDocumentMarking
      summary: Confirm a held file
      tags:
        - documents
      security:
        - bearerAuth: []
      description: A file the marking check blocked waits for this. It queues the classify job and writes an audit record. 409 when classified or not waiting. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/documents/{id}:
    delete:
      operationId: deleteDocument
      summary: Delete a document
      tags:
        - documents
      security:
        - bearerAuth: []
      description: Removes the stored file and keeps page text. Emits ingest.document.deleted, which intel uses to drop rows and to settle the credit. Deleting twice is fine. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteDocumentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/jobs/{id}/retry:
    post:
      operationId: retryIngestJob
      summary: Retry a failed ingest job
      tags:
        - jobs
      security:
        - bearerAuth: []
      description: Only a failed job retries, and only the newest step of its file (409 retry_superseded). A solicitation that lost its credit reserves one again (402 out_of_credits). The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The new job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryJobResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/bids:
    get:
      operationId: listBids
      summary: List the tenant's bids
      tags:
        - bids
      security:
        - bearerAuth: []
      description: The tenant comes from the verified token. No tenant id is sent.
      responses:
        "200":
          description: The bids.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bid"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createBid
      summary: Create a bid
      tags:
        - bids
      security:
        - bearerAuth: []
      description: The tenant comes from the verified token. No tenant id is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBidRequest"
      responses:
        "201":
          description: The bid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bid"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/bids/{id}:
    get:
      operationId: getBid
      summary: Get a bid
      tags:
        - bids
      security:
        - bearerAuth: []
      description: The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
      responses:
        "200":
          description: The bid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateBid
      summary: Change a bid
      tags:
        - bids
      security:
        - bearerAuth: []
      description: A new solicitation number rechecks held amendments. 409 key_locked once the bid holds a credit for its number. Extending file retention is owner only (403 owner_only) and needs a paid plan (402 plan_required). The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBidRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteBid
      summary: Delete a bid
      tags:
        - bids
      security:
        - bearerAuth: []
      description: Removes the bid and its rows, then emits intel.bid.deleted. Ingest deletes the bid's documents when it gets the event. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/bids/{id}/tabs/{tab}:
    get:
      operationId: getBidTab
      summary: Read a tab
      tags:
        - rows
      security:
        - bearerAuth: []
      description: The rows of one tab. Every AI-extracted row carries sourcePage and sourceQuote. An unknown tab is 404. The tenant comes from the verified token. No tenant id is sent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The bid id.
        - name: tab
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TabName"
      responses:
        "200":
          description: The tab's rows. The shape depends on the tab.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TabPayload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/bids/{id}/tabs/{tab}/rows:
    post:
      operationId: createTabRow
      summary: Add a row to a tab
      tags:
        - rows
      security:
